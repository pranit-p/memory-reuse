name: Publish to PyPI

# Publishes the package to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens are
# stored as secrets. Configure the trusted publisher once at:
#   https://pypi.org/manage/project/memory-reuse/settings/publishing/
#
# (If you prefer token-based auth instead, see the commented block at the
# bottom of the "publish" job.)

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0, v0.2.0, v1.0.0
  release:
    types: [published]
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  # ---------------------------------------------------------------------
  # 1. Run the full test suite before publishing anything.
  # ---------------------------------------------------------------------
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Lint, type-check, and test
        run: |
          ruff check memory_reuse tests
          black --check memory_reuse tests
          mypy memory_reuse
          pytest tests/ -q

  # ---------------------------------------------------------------------
  # 2. Build the sdist + wheel and validate metadata.
  # ---------------------------------------------------------------------
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------
  # 3. Publish to PyPI using Trusted Publishing (OIDC).
  # ---------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memory-reuse/
    permissions:
      id-token: write # REQUIRED for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` needed — OIDC handles authentication.
        #
        # To use an API token instead of Trusted Publishing:
        #   1. Add your token as a repo secret named PYPI_API_TOKEN
        #      (Settings → Secrets and variables → Actions → New secret)
        #   2. Remove the `permissions: id-token: write` block above.
        #   3. Uncomment the line below:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
