site_name: memory-reuse
site_description: >-
  Execution cache layer for AI agents — cut LLM and tool call costs by reusing
  previous results, with exact and semantic caching.
site_url: https://pranit-p.github.io/memory-reuse/
repo_url: https://github.com/pranit-p/memory-reuse
repo_name: pranit-p/memory-reuse
edit_uri: edit/main/docs/
copyright: Copyright &copy; Pranit Pawar — MIT License

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting started:
      - Install: install.md
      - Quick start: quickstart.md
  - Guide:
      - Usage patterns: usage.md
      - Backends & scopes: backends.md
      - Semantic cache: semantic-cache.md
      - Configuration reference: configuration.md
      - Cache statistics: statistics.md
      - Examples: examples.md
  - API reference:
      - MemoryCache & config: api/core.md
      - Caches: api/caches.md
      - Embeddings: api/embeddings.md
      - Vector index: api/vector.md
      - Integrations: api/integrations.md
  - Changelog: changelog.md
  - Vision & design: vision.md
