[project]
name = "memory-reuse"
version = "0.3.0"
description = "Execution cache layer for AI agents — cut LLM and tool call costs by reusing previous results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pranit", email = "your-email@example.com" }]
maintainers = [{ name = "Pranit", email = "your-email@example.com" }]
keywords = [
    "ai",
    "agents",
    "cache",
    "caching",
    "llm",
    "langgraph",
    "litellm",
    "cost-reduction",
    "semantic-cache",
    "redis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pranit-p/memory-reuse"
Documentation = "https://pranit-p.github.io/memory-reuse/"
Repository = "https://github.com/pranit-p/memory-reuse"
Issues = "https://github.com/pranit-p/memory-reuse/issues"
Changelog = "https://github.com/pranit-p/memory-reuse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
litellm = ["litellm>=1.40.0"]
# Graph-level execution cache. LangGraph is only ever imported lazily inside
# wrap_graph / the node paths, so the core imports fine without this extra.
langgraph = ["langgraph>=0.2.0"]
# Semantic cache with API-based embeddings (OpenAI + LiteLLM). No torch — the
# openai and litellm clients are small, and numpy is only a cosine-similarity
# speedup (there is a pure-Python fallback). One flag covers both API providers.
semantic = ["numpy>=1.26", "openai>=1.0", "litellm>=1.40.0"]
# Local embeddings via sentence-transformers. This pulls in PyTorch, which is
# large. On a CPU-only machine install the CPU torch wheel FIRST to avoid the
# ~2GB GPU/CUDA download:
#     pip install torch --index-url https://download.pytorch.org/whl/cpu
#     pip install "memory-reuse[semantic-local]"
semantic-local = ["memory-reuse[semantic]", "sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
all = ["memory-reuse[redis,litellm,semantic-local,langgraph]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_reuse"]

[tool.hatch.build.targets.sdist]
include = [
    "/memory_reuse",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["memory_reuse"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
